[project]
name = "nemontron-challenge"
version = "2026.1.0"
description = "NVIDIA Nemotron Model Reasoning Challenge"
authors = [
  { name = "Max" },
  { name = "Rong Pan" },
  { name = "James Chen", email = "jameschen312.us@gmail.com" },
  { name = "Claire" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas (>=3.0.2,<4.0.0)",
  "numpy (>=2.0.0,<2.4.0)",
  "pyyaml (>=6.0.3,<7.0.0)",
  "tqdm (>=4.67.3,<5.0.0)",
  "torch (>=2.11.0,<3.0.0)",
  "transformers (>=5.5.0,<6.0.0)",
  "peft (>=0.18.1,<0.19.0)",
  "accelerate (>=1.13.0,<2.0.0)",
  "jupyterlab (>=4.5.6,<5.0.0)",
  "matplotlib (>=3.10.8,<4.0.0)",
  "typer (>=0.24.1,<0.25.0)",
  "kagglehub (>=1.0.0,<2.0.0)",
  "termcolor (>=3.3.0,<4.0.0)",
  "tabulate (>=0.10.0,<0.11.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = "single"

[project.scripts]
nemotron = "nemotron.cli.main:app"
